<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>年视图统计</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --brand:#ff4d88; --brand-soft:#fff0f5; --bg:#f4f4f7; --surface:#fff; --text:#323232; --sub:#6d6e75; --muted:#999aa2; --line:#ececf1; --purple:#8b74d7; }
html,body { min-height:100%; } body { min-width:634px; background:#f1f0eb; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; overflow-x:auto; } button { border:0; background:none; color:inherit; font:inherit; cursor:pointer; }
.demo-stage { width:594px; min-height:100vh; margin:0 auto; display:flex; align-items:flex-start; gap:20px; }.demo-sidebar { position:sticky; top:92px; flex:0 0 144px; width:144px; margin-top:92px; }.demo-nav-item { width:100%; min-height:74px; margin-top:16px; padding:0 16px; border:1px solid rgba(75,60,145,.14); border-radius:20px; color:#5f5f61; font-size:16px; line-height:1.32; font-weight:600; text-align:left; }.demo-nav-item:first-child { margin-top:0; }.demo-nav-item.active { border-color:transparent; background:#d7d0ff; color:#4b3c91; }
.screen { flex:0 0 430px; width:430px; min-height:100vh; background:var(--bg); }.status { position:relative; height:58px; padding:22px 22px 0; background:#fff; }.time { color:#070708; font-size:19px; font-weight:600; }.island { position:absolute; top:14px; left:50%; width:196px; height:38px; transform:translateX(-50%); display:flex; align-items:center; justify-content:space-between; padding:4px 13px 4px 7px; border-radius:22px; background:#000; color:#fff; }.mini-avatar { width:30px; height:30px; border:2px solid #fff; border-radius:50%; background:radial-gradient(circle at 50% 36%,#ffd7c2 0 28%,transparent 29%),radial-gradient(circle at 50% 23%,#222 0 18%,transparent 19%),linear-gradient(135deg,#ff4b58,#ff8a5f); }.island span { font-size:14px; font-weight:600; }.phone-icons { position:absolute; top:25px; right:17px; display:flex; align-items:center; gap:7px; }.bars { display:grid; grid-template-columns:repeat(4,4px); align-items:end; gap:3px; height:17px; }.bars i { display:block; width:4px; border-radius:2px; background:#c8c8ce; }.bars i:nth-child(1){height:5px;background:#202124}.bars i:nth-child(2){height:8px;background:#202124}.bars i:nth-child(3){height:12px}.bars i:nth-child(4){height:16px}.wifi { position:relative;width:22px;height:16px}.wifi::before{content:"";position:absolute;inset:0;border:4px solid #111;border-color:#111 transparent transparent;border-radius:50% 50% 0 0}.wifi::after{content:"";position:absolute;left:8px;bottom:1px;width:7px;height:7px;border-radius:50%;background:#111}.battery{position:relative;width:28px;height:15px;border:1.7px solid #9b9ba1;border-radius:5px}.battery::before{content:"";position:absolute;inset:3px 8px 3px 3px;border-radius:2px;background:#111}.battery::after{content:"";position:absolute;top:4px;right:-4px;width:2px;height:6px;background:#9b9ba1}
.nav { height:56px; display:grid; grid-template-columns:44px 1fr 44px; align-items:center; padding:0 12px; background:#fff; border-bottom:1px solid var(--line); }.back { width:44px; height:44px; display:grid; place-items:center; }.back svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }.nav h1 { text-align:center; font-size:18px; font-weight:600; }.content { padding:14px 12px 28px; }
.year-tabs { display:flex; gap:8px; margin-bottom:12px; }.year-tab { flex:1; min-height:38px; border-radius:8px; background:#fff; color:#777880; font-size:14px; font-weight:500; }.year-tab.active { background:var(--brand-soft); color:var(--brand); font-weight:600; }.summary { padding:16px; border-radius:12px; background:#fff; }.summary-top { display:flex; align-items:baseline; justify-content:space-between; }.summary h2 { font-size:18px; font-weight:600; }.summary strong { color:var(--brand); font-size:25px; font-weight:600; font-variant-numeric:tabular-nums; }.summary strong small { margin-left:2px; font-size:13px; font-weight:500; }.summary p { margin-top:8px; color:var(--sub); font-size:13px; line-height:1.5; }.progress { height:6px; margin-top:13px; overflow:hidden; border-radius:99px; background:#f3e3e9; }.progress i { display:block; height:100%; border-radius:inherit; background:var(--brand); transition:width .2s ease; }
.section-head { display:flex; align-items:center; justify-content:space-between; margin:18px 4px 8px; }.section-head h2 { font-size:17px; font-weight:600; }.section-head span { color:var(--muted); font-size:12px; }.month-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }.month-card { min-height:93px; padding:12px 10px; border-radius:10px; background:#fff; text-align:left; }.month-card.current { background:#fff4f8; border:1px solid #ffd4e3; }.month-name { color:var(--text); font-size:14px; font-weight:600; }.month-count { margin-top:10px; color:var(--brand); font-size:22px; line-height:1; font-weight:600; font-variant-numeric:tabular-nums; }.month-count small { margin-left:2px; color:var(--sub); font-size:11px; font-weight:400; }.month-bar { height:4px; margin-top:10px; overflow:hidden; border-radius:4px; background:#f1edf0; }.month-bar i { display:block; height:100%; border-radius:inherit; background:var(--brand); }.month-card.empty .month-count { color:#c4c4ca; }.month-card.empty .month-bar i { background:#d9d9df; }
</style>
</head>
<body><div style="position:relative;z-index:9999;background:#fff0f5;color:#963051;padding:16px;font:14px/1.6 sans-serif">原demo静态参考，未接入算法。页面中的示例数字和建议未经本次验收。<a href="meiyou-menopause-home.html">返回算法联调首页</a></div>
<div class="demo-stage"><aside class="demo-sidebar" aria-label="Demo 切换"><button class="demo-nav-item" type="button" data-demo="morning">习惯养成期（1～30）</button><button class="demo-nav-item active" type="button" data-demo="ovulation">demo3</button><button class="demo-nav-item" type="button" data-demo="demo4">demo4</button><button class="demo-nav-item" type="button" data-demo="demo5">demo5</button></aside><main class="screen"><section class="status" aria-hidden="true"><div class="time">09:41</div><div class="island"><div class="mini-avatar"></div><span>美柚</span></div><div class="phone-icons"><div class="bars"><i></i><i></i><i></i><i></i></div><div class="wifi"></div><div class="battery"></div></div></section><header class="nav"><button class="back" id="back" type="button" aria-label="返回"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"></path></svg></button><h1>年视图统计</h1><span></span></header><div class="content"><nav class="year-tabs" aria-label="选择年份"><button class="year-tab" type="button" data-year="2024">2024</button><button class="year-tab" type="button" data-year="2025">2025</button><button class="year-tab active" type="button" data-year="2026">2026</button></nav><section class="summary"><div class="summary-top"><h2 id="summary-title">2026年完成情况</h2><strong id="summary-count">32<small>项</small></strong></div><p id="summary-copy">每月完成一小步，身体的变化会逐渐变得清晰。</p><div class="progress"><i id="summary-progress"></i></div></section><div class="section-head"><h2>每月完成项数</h2><span id="month-note">截至 8 月</span></div><section class="month-grid" id="month-grid" aria-label="每月完成项数"></section></div></main></div>
<script>
const params = new URLSearchParams(window.location.search); const activeDemo = params.get("demo") || "ovulation";
const yearData = { 2024:{ counts:[2,3,4,4,5,3,4,5,4,3,5,4], total:46, note:"全年已完成", copy:"持续完成每月复盘，让身体变化更有迹可循。" }, 2025:{ counts:[4,5,4,6,5,5,6,4,5,6,5,6], total:61, note:"全年已完成", copy:"这一年，你的健康记录更加稳定了。" }, 2026:{ counts:[3,4,5,4,5,3,4,4,0,0,0,0], total:32, note:"截至 8 月", copy:"每月完成一小步，身体的变化会逐渐变得清晰。" } };
function renderYear(year) { const data = yearData[year]; const completeMonths = data.counts.filter((count) => count > 0).length; document.getElementById("summary-title").textContent = `${year}年完成情况`; document.getElementById("summary-count").innerHTML = `${data.total}<small>项</small>`; document.getElementById("summary-copy").textContent = data.copy; document.getElementById("summary-progress").style.width = `${completeMonths / 12 * 100}%`; document.getElementById("month-note").textContent = data.note; document.getElementById("month-grid").innerHTML = data.counts.map((count,index) => { const ratio = Math.min(count / 6 * 100, 100); const isCurrent = year === 2026 && index === 7; return `<article class="month-card ${count ? "" : "empty"} ${isCurrent ? "current" : ""}"><div class="month-name">${index + 1}月</div><div class="month-count">${count}<small>项</small></div><div class="month-bar"><i style="width:${ratio}%"></i></div></article>`; }).join(""); document.querySelectorAll(".year-tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.year === String(year))); }
document.getElementById("back").addEventListener("click", () => { window.location.href = `./meiyou-menopause-todolist.html${activeDemo === "morning" ? "" : `?demo=${activeDemo}`}`; });
document.querySelectorAll("[data-demo]").forEach((item) => { item.classList.toggle("active", item.dataset.demo === activeDemo); item.addEventListener("click", () => { window.location.href = `./meiyou-menopause-home.html${item.dataset.demo === "morning" ? "" : `?demo=${item.dataset.demo}`}`; }); });
document.querySelectorAll(".year-tab").forEach((tab) => tab.addEventListener("click", () => renderYear(Number(tab.dataset.year))));
renderYear(2026);
</script>
</body>
</html>
