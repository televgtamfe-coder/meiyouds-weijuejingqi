<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健康记录 · 算法联调</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --brand: #ff4d88;
  --brand-deep: #eb3675;
  --brand-soft: #fff0f5;
  --bg: #f4f4f7;
  --surface: #ffffff;
  --text: #323232;
  --sub: #6f7077;
  --muted: #9d9ea6;
  --line: #ececf0;
  --purple: #ae70f5;
  --purple-soft: #f7f0ff;
  --green: #43ca7c;
  --yellow: #ffc51b;
  --blue: #58bce3;
  --radius: 12px;
}
html, body { min-height: 100%; }
body { min-width: 634px; background: #f1f0eb; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; overflow-x: auto; }
button { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.demo-stage { width: 594px; min-height: 100vh; margin: 0 auto; display: flex; align-items: flex-start; gap: 20px; }
.demo-sidebar { position: sticky; top: 92px; z-index: 10; flex: 0 0 144px; width: 144px; margin-top: 92px; }
.demo-nav-item { width: 100%; min-height: 74px; margin-top: 16px; border: 1px solid rgba(75, 60, 145, .14); border-radius: 20px; padding: 0 16px; color: #5f5f61; font-size: 16px; line-height: 1.32; font-weight: 600; text-align: left; }
.demo-nav-item:first-child { margin-top: 0; }
.demo-nav-item.active { border-color: transparent; background: #d7d0ff; color: #4b3c91; }
.screen { position: relative; flex: 0 0 430px; width: 430px; min-height: 100vh; overflow: hidden; background: var(--bg); }
.scroll { min-height: 100vh; padding-bottom: 86px; }
.status { position: relative; height: 58px; padding: 22px 22px 0; background: var(--surface); }
.time { color: #070708; font-size: 19px; font-weight: 600; }
.island { position: absolute; top: 14px; left: 50%; width: 196px; height: 38px; transform: translateX(-50%); border-radius: 22px; background: #000; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 4px 13px 4px 7px; }
.mini-avatar { width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; background: radial-gradient(circle at 50% 36%, #ffd7c2 0 28%, transparent 29%), radial-gradient(circle at 50% 23%, #222 0 18%, transparent 19%), linear-gradient(135deg, #ff4b58, #ff8a5f); }
.island span { font-size: 14px; font-weight: 600; }
.phone-icons { position: absolute; right: 17px; top: 25px; display: flex; align-items: center; gap: 7px; color: #111; }
.bars { display: grid; grid-template-columns: repeat(4, 4px); align-items: end; gap: 3px; height: 17px; }
.bars i { display: block; width: 4px; border-radius: 2px; background: #c8c8ce; }
.bars i:nth-child(1) { height: 5px; background: #202124; }.bars i:nth-child(2) { height: 8px; background: #202124; }.bars i:nth-child(3) { height: 12px; }.bars i:nth-child(4) { height: 16px; }
.wifi { position: relative; width: 22px; height: 16px; }.wifi::before { content: ""; position: absolute; inset: 0; border: 4px solid #111; border-color: #111 transparent transparent; border-radius: 50% 50% 0 0; }.wifi::after { content: ""; position: absolute; left: 8px; bottom: 1px; width: 7px; height: 7px; border-radius: 50%; background: #111; }
.battery { position: relative; width: 28px; height: 15px; border: 1.7px solid #9b9ba1; border-radius: 5px; }.battery::before { content: ""; position: absolute; inset: 3px 8px 3px 3px; border-radius: 2px; background: #111; }.battery::after { content: ""; position: absolute; top: 4px; right: -4px; width: 2px; height: 6px; background: #9b9ba1; }
.calendar-head { height: 70px; display: grid; grid-template-columns: 98px 1fr 52px; align-items: center; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.month-control { min-width: 82px; min-height: 44px; display: inline-flex; align-items: center; gap: 7px; color: #43444a; font-size: 22px; font-weight: 500; text-align: left; }
.month-control svg, .analysis svg { width: 27px; height: 27px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.record-tabs { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.record-tab { position: relative; height: 100%; min-width: 42px; color: #777880; font-size: 17px; font-weight: 500; }
.record-tab.active { color: var(--brand); font-weight: 600; }.record-tab.active::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 26px; height: 4px; transform: translateX(-50%); border-radius: 4px; background: var(--brand); }
.analysis { min-height: 44px; display: grid; justify-items: center; align-content: center; color: #45464b; font-size: 12px; line-height: 1.05; }
.calendar { padding: 6px 10px 0; background: var(--surface); }
.weekdays, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.days { grid-auto-rows: 48px; }
.weekdays { margin-bottom: 0; color: #898a91; font-size: 13px; text-align: center; }.weekdays span { height: 19px; }
.day { position: relative; min-height: 48px; padding-top: 1px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; color: var(--purple); font-size: 17px; font-variant-numeric: tabular-nums; }
.day.empty { pointer-events: none; }.date { position: relative; z-index: 1; width: 48px; height: 30px; display: grid; place-items: center; border-radius: 7px; }
.day.period .date { height: 36px; margin-top: 0; border-radius: 8px; background: var(--brand); color: #fff; font-size: 19px; }
.day.period-start .date::before { content: ""; position: absolute; top: 5px; width: 10px; height: 13px; border-radius: 50% 50% 55% 55%; background: var(--yellow); clip-path: polygon(50% 0, 78% 40%, 90% 72%, 50% 100%, 10% 72%, 22% 40%); }
.day.period-start .date { padding-top: 12px; }.day.period-end .date::before { content: ""; position: absolute; top: 5px; width: 10px; height: 13px; border-radius: 5px; background: var(--yellow); }.day.period-end .date { padding-top: 12px; }
.day.green { color: var(--green); }.day.today .date { height: 36px; margin-top: 0; border: 2px solid var(--brand); border-radius: 8px; color: var(--purple); }.day.today small { position: relative; z-index: 1; margin-top: -2px; color: var(--purple); font-size: 9px; font-weight: 600; }
.event { position: relative; z-index: 2; min-height: 9px; margin-top: -1px; color: var(--brand); font-size: 10px; line-height: 10px; font-weight: 600; white-space: nowrap; }.event.green { color: #00be91; }.event.yellow { color: var(--yellow); font-size: 13px; }.event.purple { color: var(--purple); font-size: 13px; }.event.heart { color: #ff7ea7; font-size: 14px; }.calendar-task { position: absolute; z-index: 3; top: 31px; left: 2px; color: #00b894; font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: 0; white-space: nowrap; }
.calendar-legend { display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 0 18px; overflow-x: auto; color: #898a90; font-size: 12px; white-space: nowrap; }.legend { display: inline-flex; align-items: center; gap: 5px; }.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--brand); }.legend .predict { background: #ffd7e5; }.legend .ovulation { background: var(--purple); }.legend .ovulation-day { border-radius: 50%; background: #c28df9; }
.content { padding: 10px 12px 20px; }
.insight { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 10px; min-height: 86px; padding: 13px; border-radius: var(--radius); background: var(--surface); }.insight-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 22px; }.insight h2 { color: var(--brand); font-size: 16px; line-height: 1.35; font-weight: 600; }.insight p { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.4; }.insight button { min-width: 64px; height: 32px; border-radius: 17px; background: var(--brand); color: #fff; font-size: 13px; font-weight: 500; }
.record-card { margin-top: 10px; padding: 0 12px; border-radius: var(--radius); background: var(--surface); overflow: hidden; }.record-card-head { display: flex; align-items: baseline; justify-content: space-between; min-height: 52px; }.record-card h1 { font-size: 18px; font-weight: 600; }.record-card-head span { color: var(--muted); font-size: 12px; }
.record-row { display: grid; grid-template-columns: 31px 1fr auto; align-items: center; column-gap: 8px; min-height: 59px; border-top: 1px solid var(--line); }.row-icon { width: 27px; height: 27px; border-radius: 9px; color: #fff; display: grid; place-items: center; font-size: 16px; line-height: 1; }.row-icon.period { background: #ff75a5; }.row-icon.symptom { background: var(--blue); }.row-icon.mood { background: #ffc24b; }.row-icon.sleep { background: #8772d7; }.row-icon.supplement { background: #58b58b; font-size: 13px; font-weight: 600; }.row-icon.weight { background: #5aaac9; font-size: 12px; font-weight: 600; }.row-icon.bowel { background: #f0a24b; }.row-icon.intimacy { background: #ef7098; }.row-icon.habit { background: #61b992; }.row-icon.diary { background: #7287c9; }.row-icon.discharge { background: #b26df4; }
.row-title { font-size: 17px; font-weight: 500; }.row-note { margin-top: 2px; color: var(--muted); font-size: 12px; }.add { width: 32px; height: 32px; border: 2px solid var(--brand); border-radius: 50%; color: var(--brand); display: grid; place-items: center; font-size: 27px; line-height: 1; font-weight: 300; }.segmented { display: flex; overflow: hidden; border-radius: 7px; background: #ececef; }.segmented button { width: 43px; height: 34px; color: #a1a1a6; font-size: 15px; }.segmented button.active { background: var(--brand); color: #fff; }
.timeline-arrow { width: 36px; height: 36px; border: 0; border-radius: 0; display: grid; place-items: center; color: #a3a4ab; font-size: 28px; line-height: 1; }
.mood-options { display: flex; align-items: center; gap: 4px; }.mood { width: 28px; height: 28px; border-radius: 50%; background: #f0f0f2; color: #aaaab0; display: grid; place-items: center; font-size: 15px; filter: grayscale(1); }.mood.active { background: #fff2bb; color: #eb9e18; filter: none; outline: 2px solid rgba(255, 194, 75, .35); }
.row-detail { display: none; grid-column: 2 / 4; margin: -2px 0 10px; padding: 9px 10px; border-radius: 8px; background: #fafafd; color: var(--sub); font-size: 12px; line-height: 1.5; }.record-row.expanded { grid-template-rows: 59px auto; }.record-row.expanded .row-detail { display: block; }
.bottom-nav { position: fixed; left: calc(50% + 82px); bottom: 0; z-index: 20; width: 430px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, 1fr); padding: 7px 4px max(7px, env(safe-area-inset-bottom)); border-top: 1px solid #e4e4e8; background: rgba(255,255,255,.98); }.nav-item { position: relative; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #595a61; font-size: 11px; font-weight:500; }.nav-screenshot-icon { display:block; width:29px; height:29px; object-fit:cover; object-position:center top; filter:grayscale(1) contrast(.86) opacity(.92); transition:filter .16s ease,transform .16s ease; }.nav-screenshot-icon.nav-message-icon { width:51px; }.nav-item.active { color:var(--brand); font-weight:600; }.nav-item.active .nav-screenshot-icon { filter:invert(47%) sepia(79%) saturate(2117%) hue-rotate(304deg) brightness(101%) contrast(101%); transform:scale(1.04); }
.toast { position: fixed; left: calc(50% + 82px); bottom: 88px; z-index: 30; width: min(340px, calc(100% - 32px)); padding: 10px 14px; transform: translateX(-50%) translateY(10px); border-radius: 18px; background: rgba(35,35,38,.92); color: #fff; text-align: center; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; }.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 370px) { .calendar-head { grid-template-columns: 78px 1fr 45px; padding-inline: 9px; }.month-control { font-size: 20px; }.record-tab { min-width: 34px; font-size: 15px; }.days { grid-auto-rows: 46px; }.day { min-height: 46px; }.date { width: 44px; }.calendar-legend { gap: 10px; padding-inline: 12px; }.mood-options { gap: 2px; }.mood { width: 24px; height: 24px; font-size: 13px; } }
