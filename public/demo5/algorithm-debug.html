* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --brand:#ff4d88; --brand-deep:#e93d76; --brand-soft:#fff0f5; --bg:#f4f4f7; --surface:#fff; --text:#323232; --sub:#6d6e75; --muted:#999aa2; --line:#ececf1; --green:#00b894; }
html,body { min-height:100%; } body { min-width:430px; background:#f1f0eb; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; } button { border:0; background:none; color:inherit; font:inherit; cursor:pointer; }
.screen { width:430px; min-height:100vh; margin:0 auto; background:var(--bg); }.scroll { min-height:100vh; padding-bottom:28px; }.status { position:relative; height:58px; padding:22px 22px 0; background:#fff; }.time { color:#070708; font-size:19px; font-weight:600; }.island { position:absolute; top:14px; left:50%; width:196px; height:38px; transform:translateX(-50%); display:flex; align-items:center; justify-content:space-between; padding:4px 13px 4px 7px; border-radius:22px; background:#000; color:#fff; }.mini-avatar { width:30px; height:30px; border:2px solid #fff; border-radius:50%; background:radial-gradient(circle at 50% 36%,#ffd7c2 0 28%,transparent 29%),radial-gradient(circle at 50% 23%,#222 0 18%,transparent 19%),linear-gradient(135deg,#ff4b58,#ff8a5f); }.island span { font-size:14px; font-weight:600; }.phone-icons { position:absolute; top:25px; right:17px; display:flex; align-items:center; gap:7px; }.bars { display:grid; grid-template-columns:repeat(4,4px); align-items:end; gap:3px; height:17px; }.bars i { display:block; width:4px; border-radius:2px; background:#202124; }.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:12px;background:#c8c8ce}.bars i:nth-child(4){height:16px;background:#c8c8ce}.battery{position:relative;width:28px;height:15px;border:1.7px solid #9b9ba1;border-radius:5px}.battery::before{content:"";position:absolute;inset:3px 8px 3px 3px;border-radius:2px;background:#111}.battery::after{content:"";position:absolute;top:4px;right:-4px;width:2px;height:6px;background:#9b9ba1}
.nav { height:56px; display:grid; grid-template-columns:44px 1fr 44px; align-items:center; padding:0 12px; border-bottom:1px solid var(--line); background:#fff; }.back { width:44px; height:44px; display:grid; place-items:center; color:#333; }.back svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }.nav h1 { text-align:center; font-size:18px; font-weight:600; }.nav-placeholder { width:44px; height:44px; }
.content { padding:14px 12px 0; }.date-line { display:flex; align-items:center; justify-content:space-between; padding:0 4px 12px; }.date-line span:first-child { color:var(--text); font-size:17px; font-weight:600; }.date-line span:last-child { display:inline-flex; align-items:center; gap:5px; color:var(--green); font-size:12px; font-weight:600; }.date-line i { width:7px; height:7px; border-radius:50%; background:var(--green); }
.score { display:grid; grid-template-columns:1fr auto; align-items:center; min-height:78px; padding:14px 16px; border-radius:12px; background:linear-gradient(135deg,#fff1f6,#fff); border:1px solid #ffe0ec; }.score-label { color:var(--brand-deep); font-size:13px; font-weight:600; }.score-copy { margin-top:5px; color:var(--sub); font-size:13px; line-height:1.45; }.score-value { color:var(--brand-deep); font-size:30px; line-height:1; font-weight:600; font-variant-numeric:tabular-nums; }.score-value small { margin-left:2px; font-size:13px; font-weight:500; }
.check-list { margin-top:12px; overflow:hidden; border-radius:12px; background:var(--surface); }.check-row { padding:14px 14px 13px; border-top:1px solid var(--line); }.check-row:first-child { border-top:0; }.check-head { display:grid; grid-template-columns:30px minmax(0,1fr) auto; align-items:center; gap:9px; }.check-icon { width:30px; height:30px; display:grid; place-items:center; border-radius:9px; background:var(--brand-soft); color:var(--brand); }.check-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }.check-title { color:var(--text); font-size:15px; font-weight:500; }.check-state { max-width:120px; color:var(--brand-deep); font-size:12px; text-align:right; white-space:nowrap; }.check-scale { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:11px; }.check-step { height:9px; border-radius:99px; background:#ececef; transition:background .15s ease,transform .15s ease; }.check-step.active:nth-child(1) { background:#ffd7e5; }.check-step.active:nth-child(2) { background:#ffb4cf; }.check-step.active:nth-child(3) { background:#ff8fba; }.check-step.active:nth-child(4) { background:#ff699f; }.check-step.active:nth-child(5) { background:var(--brand); }.check-step:active { transform:scaleY(1.25); }.check-ends { display:flex; justify-content:space-between; margin-top:7px; color:var(--muted); font-size:11px; line-height:1.3; }
.toast { position:fixed; left:50%; bottom:28px; z-index:10; min-height:40px; padding:10px 16px; transform:translate(-50%,12px); border:1px solid #ffd3e2; border-radius:10px; background:#fff; box-shadow:0 8px 24px rgba(220,69,124,.14); color:var(--brand-deep); font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .18s ease,transform .18s ease; white-space:nowrap; }.toast.visible { opacity:1; transform:translate(-50%,0); }
