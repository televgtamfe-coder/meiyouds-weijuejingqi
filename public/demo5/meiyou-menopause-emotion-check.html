<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>情绪与压力自检</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root { --brand: #d6577d; --brand-deep: #bf4268; --brand-soft: #fff0f4; --bg: #fbf6f8; --surface: #fff; --text: #323232; --sub: #777; --tertiary: #999; --line: #e5d5dc; }
html, body { min-height: 100%; }
body { min-width: 634px; background: #f1f0eb; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
button { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.stage { width: 594px; min-height: 100vh; margin: 0 auto; background: var(--bg); }
.app { width: 430px; min-height: 100vh; margin: 0 auto; padding: 12px 16px 98px; background: var(--bg); }
.topbar { height: 42px; display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; }
.back { width: 42px; height: 42px; font-size: 36px; line-height: 34px; }
.topbar h1 { text-align: center; font-size: 17px; font-weight: 600; }
.header-copy { padding: 8px 8px 18px; text-align: center; }
.date-switch { display: flex; align-items: center; justify-content: center; gap: 22px; width: 132px; height: 34px; margin: 0 auto; border-radius: 18px; background: #ececf0; color: var(--text); font-size: 15px; font-weight: 600; }
.date-shift { width: 20px; height: 26px; color: #aaa; font-size: 22px; line-height: 20px; }
.date-navigation { margin: -12px -16px 14px; padding: 0 16px 13px; background: #ff5d96; color: #fff; }
.date-nav-head { height: 48px; display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; }
.date-nav-back { width: 42px; height: 42px; color: #fff; font-size: 36px; line-height: 34px; }
.date-nav-head h1 { text-align: center; font-size: 18px; line-height: 25px; font-weight: 600; }
.date-nav-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.date-nav-tab { min-height: 32px; color: rgba(255,255,255,.62); font-size: 13px; line-height: 18px; white-space: nowrap; }
.date-nav-tab.active { color: #fff; font-size: 15px; font-weight: 600; }
.intro { margin: 12px 0; padding: 16px; border-radius: 12px; background: var(--surface); }
.intro h2 { color: var(--text); font-size: 18px; line-height: 25px; font-weight: 600; }
.intro p { margin-top: 5px; color: var(--sub); font-size: 13px; line-height: 20px; }
.header-copy h2 { margin-top: 6px; color: var(--brand); font-size: 25px; line-height: 34px; font-weight: 600; }
.header-copy p { margin-top: 5px; color: var(--tertiary); font-size: 14px; }
.step { display: block; }
.step[hidden] { display: none; }
.step + .step { margin-top: 12px; }
.ai-insight + .step { margin-top: 0; }
.ai-insight[hidden] + .step { margin-top: 12px; }
.panel { padding: 22px 18px; border-radius: 18px; background: var(--surface); }
.question { color: var(--text); font-size: 18px; line-height: 26px; font-weight: 600; }
.hint { margin-top: 11px; color: var(--tertiary); font-size: 14px; line-height: 22px; }
.mood-scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 22px; }
.mood-option { min-width: 0; padding: 10px 2px; border: 2px solid transparent; border-radius: 12px; text-align: center; }
.mood-option.active { border-color: #ffc5d4; background: #fff5f7; }
.mood-icon { display: block; height: 44px; font-size: 31px; line-height: 44px; }
.mood-name { display: block; margin-top: 6px; color: #777; font-size: 13px; white-space: nowrap; }
.mood-score { display: block; margin-top: 4px; color: var(--brand); font-size: 13px; }
.mood-range { display: flex; justify-content: space-between; margin: 20px 4px 0; color: #bbb; font-size: 13px; }
.cause-list { display: grid; gap: 10px; margin-top: 17px; }
.cause-option { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 75px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 13px; text-align: left; }
.cause-option.active { border-color: var(--brand); background: #fff7f9; }
.cause-icon { font-size: 23px; text-align: center; }
.cause-title { display: block; font-size: 16px; line-height: 22px; font-weight: 600; }
.cause-desc { display: block; margin-top: 3px; color: var(--tertiary); font-size: 13px; line-height: 18px; }
.cause-option.active .cause-desc { color: var(--brand); }
.signals-panel { margin-top: 12px; }
.signal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 18px; }
.signal-option { min-height: 40px; padding: 7px 8px; border: 2px solid var(--line); border-radius: 22px; color: #777; font-size: 14px; text-align: center; }
.signal-option.active { border-color: #ffc5d4; background: #fff6f8; color: var(--brand); font-weight: 600; }
.ai-insight { margin: 0 0 12px; padding: 18px 16px; border: 1px solid #ffd1dd; border-radius: 14px; background: #fff8fa; }
.ai-insight[hidden] { display: none; }
.ai-title { display: flex; align-items: center; gap: 7px; color: var(--brand); font-size: 18px; line-height: 25px; font-weight: 600; }
.ai-mark { display: inline-flex; align-items: center; justify-content: center; min-width: 23px; height: 17px; padding: 0 4px; border-radius: 4px; background: #ffe3eb; color: var(--brand-deep); font-size: 10px; line-height: 1; font-weight: 700; }
.ai-copy { min-height: 78px; margin-top: 13px; color: #5f5f63; font-size: 16px; line-height: 25px; }
.ai-advice { margin-top: 14px; padding: 13px; border-radius: 10px; background: #fff; color: #4a4a4d; font-size: 15px; line-height: 24px; }
.ai-advice[hidden] { display: none; }
.ai-advice-title { margin-bottom: 6px; color: var(--tertiary); font-size: 13px; }
.next-wrap { position: fixed; z-index: 2; bottom: 0; left: 50%; width: 430px; padding: 12px 16px 18px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(251,246,248,0), var(--bg) 28%); }
.next { width: 100%; height: 48px; border-radius: 24px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 600; box-shadow: 0 6px 14px rgba(214,87,125,.2); }
.toast { position: fixed; z-index: 3; left: 50%; bottom: 84px; padding: 9px 13px; transform: translate(-50%, 12px); border-radius: 18px; background: rgba(35,35,38,.88); color: #fff; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; white-space: nowrap; }
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 633px) { body { min-width: 0; background: var(--bg); } .stage { width: 100%; } .app, .next-wrap { width: 100%; } }
</style>
</head>
<body><div style="position:relative;z-index:9999;background:#fff0f5;color:#963051;padding:16px;font:14px/1.6 sans-serif">原demo静态参考，未接入算法。页面中的示例数字和建议未经本次验收。<a href="meiyou-menopause-home.html">返回算法联调首页</a></div>
<div class="stage"><main class="app">
  <header class="date-navigation" aria-label="日期导航"><div class="date-nav-head"><button class="date-nav-back" id="back" type="button" aria-label="返回">‹</button><h1>情绪评分</h1><span></span></div><nav class="date-nav-tabs"><button class="date-nav-tab" type="button" data-date="yesterday">周日（8月30日）</button><button class="date-nav-tab active" type="button" data-date="today">今天（8月31日）</button><button class="date-nav-tab" type="button" data-date="tomorrow">周二（9月1日）</button></nav></header>
  <section class="intro"><h2>快速记录今天的情绪状态</h2><p>围绝经期的情绪波动常与睡眠、潮热和压力有关，留下一次记录，就多一个看见规律的线索。</p></section>
  <section class="step"><div class="panel"><h2 class="question">今天的情绪评分</h2><div class="mood-scale" id="mood-scale"><button class="mood-option" type="button" data-score="1"><span class="mood-icon">😣</span><span class="mood-name">崩溃</span><span class="mood-score">1分</span></button><button class="mood-option" type="button" data-score="2"><span class="mood-icon">😔</span><span class="mood-name">低落</span><span class="mood-score">2分</span></button><button class="mood-option active" type="button" data-score="3"><span class="mood-icon">😐</span><span class="mood-name">一般</span><span class="mood-score">3分</span></button><button class="mood-option" type="button" data-score="4"><span class="mood-icon">🙂</span><span class="mood-name">不错</span><span class="mood-score">4分</span></button><button class="mood-option" type="button" data-score="5"><span class="mood-icon">😄</span><span class="mood-name">很好</span><span class="mood-score">5分</span></button></div></div></section>
  <section class="ai-insight" id="ai-insight" aria-label="AI 今日洞察" hidden><div class="ai-title"><span class="ai-mark">AI</span>今日洞察</div><p class="ai-copy" id="ai-copy"></p><div class="ai-advice" id="ai-advice" hidden><div class="ai-advice-title">今晚建议</div><div>🌙 不必强迫自己“想开点”，允许自己低落</div><div>🫁 做3分钟 4-7-8 呼吸（吸气4秒-屏息7秒-呼气8秒）</div><div>📝 把烦心的事写下来，告诉自己“明天再处理”</div></div></section>
  <section class="step" id="cause-step"><div class="panel"><h2 class="question">这种情绪有明确原因吗？</h2><p class="hint">围绝经期激素波动常导致“莫名其妙就难受”，识别这一点很重要。</p><div class="cause-list" id="cause-list"><button class="cause-option" type="button" data-cause="明确原因"><span class="cause-icon">🎯</span><span><span class="cause-title">有明确原因</span><span class="cause-desc">比如工作烦、和家人吵架、遇到糟心事</span></span></button><button class="cause-option active" type="button" data-cause="莫名其妙"><span class="cause-icon">🌊</span><span><span class="cause-title">没有，莫名其妙</span><span class="cause-desc">说不清为什么，突然就低落/烦躁了</span></span></button><button class="cause-option" type="button" data-cause="说不清"><span class="cause-icon">🤔</span><span><span class="cause-title">说不清</span><span class="cause-desc">好像有原因，又好像不完全是</span></span></button></div></div></section>
  <section class="step" id="signals-step"><div class="panel signals-panel"><h2 class="question">今天还伴随这些身体信号吗？（多选）</h2><p class="hint">帮助判断情绪是否受激素波动影响。</p><div class="signal-grid" id="signal-grid"><button class="signal-option" type="button">🔥 潮热/盗汗</button><button class="signal-option" type="button">🌙 失眠/早醒</button><button class="signal-option" type="button">🦴 关节/肌肉痛</button><button class="signal-option" type="button">🧠 脑雾/健忘</button><button class="signal-option" type="button">💧 阴道干涩</button><button class="signal-option" type="button">⚡ 异常疲劳</button><button class="signal-option" type="button">🩸 出血异常</button><button class="signal-option" type="button">🚫 都没有</button></div></div></section>
</main></div>
<div class="next-wrap"><button class="next" id="next" type="button">完成自检</button></div><div class="toast" id="toast" role="status"></div>
<script>
const state = { score: 3, cause: "莫名其妙", signals: new Set() };
const next = document.getElementById("next");
const toast = document.getElementById("toast");
const aiInsight = document.getElementById("ai-insight");
const aiCopy = document.getElementById("ai-copy");
const aiAdvice = document.getElementById("ai-advice");
const causeStep = document.getElementById("cause-step");
const signalsStep = document.getElementById("signals-step");
let toastTimer;
let aiTypingTimer;
function showToast(message) { window.clearTimeout(toastTimer); toast.textContent = message; toast.classList.add("visible"); toastTimer = window.setTimeout(() => toast.classList.remove("visible"), 1600); }
function updateFollowUpQuestions() {
  const shouldShow = state.score <= 2;
  causeStep.hidden = !shouldShow;
  signalsStep.hidden = !shouldShow;
  if (!shouldShow) {
    state.cause = "";
    state.signals = new Set();
    document.querySelectorAll("#signal-grid .signal-option").forEach((item) => item.classList.remove("active"));
  } else if (!state.cause) {
    state.cause = "莫名其妙";
  }
}
function buildAiInsight() {
  const signals = Array.from(state.signals);
  if (state.score >= 3) return "今天的情绪整体比较平稳。继续保留一点属于自己的休息时间，让身体和心情都慢慢回到舒服的节奏。";
  const signalText = signals.includes("🔥 潮热/盗汗") ? "同时今天有潮热" : signals.includes("🌙 失眠/早醒") ? "同时伴有失眠或早醒" : signals.length && !signals.includes("🚫 都没有") ? `同时伴有${signals[0].replace(/^.. /, "")}` : "身体信号暂时不明显";
  if (state.cause === "莫名其妙") return `你选了“莫名其妙”，${signalText}。这很可能是激素波动带来的情绪变化，不是你的问题，是身体在调整。`;
  if (state.cause === "明确原因") return `你今天的情绪有明确诱因，${signalText}。先把外部压力和身体感受分开看，给自己一点缓冲空间。`;
  return `今天的情绪原因还不太确定，${signalText}。先连续记录几天，睡眠、潮热和压力的变化会慢慢给出线索。`;
}
function streamAiInsight(text) {
  window.clearTimeout(aiTypingTimer);
  aiCopy.textContent = "";
  aiAdvice.hidden = true;
  const chars = Array.from(text);
  let index = 0;
  const typeNext = () => {
    aiCopy.textContent = chars.slice(0, index).join("");
    if (index >= chars.length) { aiAdvice.hidden = false; return; }
    index += 1;
    aiTypingTimer = window.setTimeout(typeNext, 20);
  };
  typeNext();
}
document.getElementById("mood-scale").addEventListener("click", (event) => { const option = event.target.closest(".mood-option"); if (!option) return; state.score = Number(option.dataset.score); document.querySelectorAll(".mood-option").forEach((item) => item.classList.toggle("active", item === option)); updateFollowUpQuestions(); });
document.getElementById("cause-list").addEventListener("click", (event) => { const option = event.target.closest(".cause-option"); if (!option) return; state.cause = option.dataset.cause; document.querySelectorAll(".cause-option").forEach((item) => item.classList.toggle("active", item === option)); });
document.getElementById("signal-grid").addEventListener("click", (event) => { const option = event.target.closest(".signal-option"); if (!option) return; const text = option.textContent.trim(); if (text === "🚫 都没有") { document.querySelectorAll("#signal-grid .signal-option").forEach((item) => item.classList.toggle("active", item === option)); state.signals = new Set([text]); return; } document.querySelector("#signal-grid .signal-option:last-child").classList.remove("active"); state.signals.delete("🚫 都没有"); option.classList.toggle("active"); option.classList.contains("active") ? state.signals.add(text) : state.signals.delete(text); });
next.addEventListener("click", () => { window.localStorage.setItem("meiyou-emotion-check", JSON.stringify({ score: state.score, cause: state.cause, signals: Array.from(state.signals) })); aiInsight.hidden = false; window.scrollTo({ top: 0, behavior: "smooth" }); window.setTimeout(() => streamAiInsight(buildAiInsight()), 260); showToast("情绪自检已记录"); });
document.getElementById("back").addEventListener("click", () => { window.location.href = `./meiyou-menopause-home.html?demo=${new URLSearchParams(window.location.search).get("demo") || "ovulation"}`; });
document.querySelectorAll(".date-nav-tab").forEach((tab) => tab.addEventListener("click", () => document.querySelectorAll(".date-nav-tab").forEach((item) => item.classList.toggle("active", item === tab))));
updateFollowUpQuestions();
</script>
</body>
</html>
